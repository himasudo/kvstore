name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Build tests
        run: make test

      - name: Run tests
        run: |
          ./test_pipeline
          ./test_recovery
          ./test_mutation_ordering
          ./test_checkpoint
          ./test_wal_recovery
          ./test_snapshot_recovery
          ./test_persistence_format
          ./test_persistence_failpoints
          ./test_io_faults
          ./test_parser_incremental

      - name: TCP protocol integration
        run: python3 tests/test_tcp_protocol.py ./kvstore

      - name: Multi-client and backpressure stress
        run: python3 tests/test_network_stress.py ./kvstore

      - name: Listener bind-failure regression
        run: python3 tests/test_startup_failure.py ./kvstore

      - name: Network syscall failure injection
        run: |
          make kvstore-netfault
          python3 tests/test_network_faults.py ./kvstore-netfault

      - name: Stress
        run: make stress

      - name: Crash/restart recovery
        run: python3 tests/test_crash_recovery.py ./kvstore

      - name: Torn WAL tail startup
        run: python3 tests/test_torn_tail_startup.py ./kvstore

      - name: Startup error handling
        run: python3 tests/test_startup_errors.py ./kvstore

  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Address/undefined behavior sanitizers
        run: make sanitize

      - name: Network Address/UndefinedBehaviorSanitizer integration
        run: |
          make kvstore-network-sanitize
          python3 tests/test_tcp_protocol.py ./kvstore-network-sanitize

      - name: ThreadSanitizer mutation ordering
        run: |
          make test_mutation_ordering-tsan
          ./test_mutation_ordering-tsan

      - name: ThreadSanitizer checkpointing
        run: |
          make test_checkpoint-tsan
          ./test_checkpoint-tsan
