name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Build tests
        run: make test

      - name: Run tests
        run: |
          ./test_pipeline
          ./test_recovery
          ./test_mutation_ordering
          ./test_checkpoint
          ./test_wal_recovery
          ./test_snapshot_recovery
          ./test_persistence_format
          ./test_persistence_failpoints

      - name: Stress
        run: make stress

      - name: Crash/restart recovery
        run: python3 tests/test_crash_recovery.py ./kvstore

  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Address/undefined behavior sanitizers
        run: make sanitize

      - name: ThreadSanitizer mutation ordering
        run: |
          make test_mutation_ordering-tsan
          ./test_mutation_ordering-tsan

      - name: ThreadSanitizer checkpointing
        run: |
          make test_checkpoint-tsan
          ./test_checkpoint-tsan
